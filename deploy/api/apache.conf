<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    LimitRequestBody 33554432
    ErrorLog /proc/self/fd/2
    # Do not put capability tokens from request paths into access logs.
    CustomLog /proc/self/fd/1 "%h %m %>s %b"
</VirtualHost>
